<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Favicon: 32x32 PNG for browser tabs, 180x180 for iOS home-screen
         bookmarks. Both downsized from public/logo.png via sips so the
         tab icon loads in ~2KB instead of the 521KB full logo. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://use.typekit.net" crossorigin />
    <!-- display=optional: brief block period; if Playfair isn't ready,
         the page uses the fallback for this load (no mid-render swap
         and no layout reflow). Cached for next visit. Aggressive but
         the only way to fully guarantee no visible blink. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;800&display=optional"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://use.typekit.net/amy5ajz.css" />
    <title>The Good Plans Co — Client Portal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
